openapi: 3.0.3
info:
  title: Vagas JL API
  description: >
    API REST que conecta profissionais de testes de software a oportunidades de trabalho,
    e permite que empresas encontrem profissionais compativeis com suas vagas.
    Inclui cadastro (VJ-1), login (VJ-2), edicao (VJ-4), consulta publica autenticada (VJ-6),
    cadastro de candidatos (VJ-22), exclusao da propria conta (VJ-23), validacao de
    elegibilidade (VJ-24), visualizacao individual (VJ-25), alteracao (VJ-26) e exclusao
    logica de candidatos (VJ-27), cadastro empresarial separado (VJ-37) e vinculo
    de recrutador verificado (VJ-38), edicao controlada (VJ-39) e consulta
    protegida do cadastro empresarial (VJ-40), exclusao logica com revogacao (VJ-41),
    catalogo versionado (VJ-28), cadastro de vaga propria (VJ-42) e origem
    rastreavel independente do Perfil de Match (VJ-43) e cadastro do Perfil de Match
    do candidato (VJ-29) e sua edicao (VJ-30).
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Ambiente local
tags:
  - name: Match Profile
    description: Configuracao administrativa dos campos, pesos e catalogos compartilhados
  - name: Vacancies
    description: Oportunidades cadastradas pelas empresas
  - name: Companies
    description: Cadastro administrativo de empresas
  - name: Candidates
    description: Cadastro, validacao, visualizacao, alteracao e exclusao logica de candidatos
  - name: Auth
    description: Cadastro e autenticacao de usuarios
  - name: Users
    description: Cadastro e dados de usuarios
  - name: Health
    description: Verificacao de disponibilidade da API

paths:
  /configuracoes/match/multiplicadores:
    put:
      tags: [Match Profile]
      summary: Publica multiplicadores versionados do Match (VJ-52)
      description: >
        Apenas administrador autenticado. required=1 e indifferent=0 sao invariantes;
        desirable deve ser estritamente maior que 0 e menor que 1. Repetir a
        configuracao vigente nao incrementa a versao. Sem publicacao, rankings
        com pares pontuaveis retornam 503 em vez de usar fator implicito.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required, desirable, indifferent]
              additionalProperties: false
              properties:
                required: { type: number, enum: [1] }
                desirable: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
                indifferent: { type: number, enum: [0] }
      responses:
        '200':
          description: Configuracao publicada ou mantida
          content:
            application/json:
              schema:
                type: object
                required: [configuration]
                properties:
                  configuration:
                    type: object
                    required: [version, multipliers, effectiveAt, author]
                    properties:
                      version: { type: integer, minimum: 1 }
                      multipliers:
                        type: object
                        required: [required, desirable, indifferent]
                        properties:
                          required: { type: number, enum: [1] }
                          desirable: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
                          indifferent: { type: number, enum: [0] }
                      effectiveAt: { type: string, format: date-time }
                      author: { type: string }
        '400': { description: Multiplicadores invalidos }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Sem permissao administrativa }
        '409': { description: Publicacao concorrente de outra configuracao }
  /configuracoes/match/limiar-ranking:
    put:
      tags: [Match Profile]
      summary: Publica percentual minimo versionado para rankings (VJ-65)
      description: >
        Apenas administrador autenticado. Aceita percentual de 0 a 100 com ate duas
        casas decimais. Repetir o valor vigente nao incrementa a versao. Sem publicacao,
        nenhum corte percentual arbitrario e aplicado. Novas consultas usam imediatamente
        a versao mais recente, sem alterar pontos, pesos, gaps ou inelegibilidade.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minimumPercentage]
              additionalProperties: false
              properties:
                minimumPercentage:
                  type: number
                  minimum: 0
                  maximum: 100
                  multipleOf: 0.01
                  example: 60
      responses:
        '200':
          description: Limiar publicado ou mantido
          content:
            application/json:
              schema:
                type: object
                required: [configuration]
                properties:
                  configuration:
                    type: object
                    required: [version, minimumPercentage, effectiveAt, author]
                    properties:
                      version: { type: integer, minimum: 1 }
                      minimumPercentage: { type: number, minimum: 0, maximum: 100 }
                      effectiveAt: { type: string, format: date-time }
                      author: { type: string }
        '400': { description: Percentual ou corpo invalido }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Sem permissao administrativa }
        '409': { description: Publicacao concorrente de outro limiar }
  /configuracoes/match/completude-minima:
    put:
      tags: [Match Profile]
      summary: Publica completude minima versionada para recomendacoes (VJ-73)
      description: >
        Apenas administrador autenticado. Aceita percentual de 0 a 100 com ate duas
        casas decimais. Repetir o valor vigente nao cria versao. Sem publicacao, a
        recomendacao nao recebe bloqueio arbitrario de completude.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minimumPercentage]
              additionalProperties: false
              properties:
                minimumPercentage:
                  type: number
                  minimum: 0
                  maximum: 100
                  multipleOf: 0.01
                  example: 70
      responses:
        '200':
          description: Completude minima publicada ou mantida
          content:
            application/json:
              schema:
                type: object
                required: [configuration]
                properties:
                  configuration:
                    type: object
                    required: [version, minimumPercentage, effectiveAt, author]
                    properties:
                      version: { type: integer, minimum: 1 }
                      minimumPercentage: { type: number, minimum: 0, maximum: 100 }
                      effectiveAt: { type: string, format: date-time }
                      author: { type: string }
        '400': { description: Percentual ou corpo invalido }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Sem permissao administrativa }
        '409': { description: Publicacao concorrente de outra configuracao }
  /configuracoes/importacao/importancia-padrao:
    put:
      tags: [Match Profile]
      summary: Publica importancia padrao versionada para vagas importadas (VJ-49)
      description: >
        Apenas administrador autenticado. Aceita somente importance. Retorna a
        versao, autor e data de vigencia. A mesma importancia mantem a versao;
        alteracoes afetam apenas novas importacoes, sem recalcular vagas existentes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importance]
              additionalProperties: false
              properties:
                importance: { type: string, enum: [required, desirable, indifferent] }
      responses:
        '200':
          description: Configuracao publicada ou mantida
          content:
            application/json:
              schema:
                type: object
                properties:
                  configuration:
                    type: object
                    properties:
                      version: { type: integer, minimum: 1 }
                      importance: { type: string, enum: [required, desirable, indifferent] }
                      effectiveAt: { type: string, format: date-time }
                      author: { type: string }
        '400': { description: Corpo ou importancia invalidos }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Sem permissao administrativa }
        '409': { description: Publicacao concorrente de outra importancia }
  /candidatos/me/vagas/ranking:
    get:
      tags: [Vacancies]
      summary: Lista vagas elegiveis por Match com Top 3, 5 ou 10 (VJ-45/VJ-63)
      description: >
        Requer JWT de candidato com cadastro e Perfil de Match. Aplica status active,
        prazo vigente e empresa active para vagas COMPANY antes de pontuar, ordenar e
        paginar. Nao usa cache. Origem nao modifica o percentual tecnico. Campos false
        de vagas IMPORTED nao pontuam nem eliminam; sem requisito pontuavel, a
        compatibilidade tecnica e nao calculavel e a vaga nao entra no ranking. O
        limit aceita Top 3, Top 5 e Top 10. Depois dos filtros, ordena por percentual,
        requisitos obrigatorios atendidos, atualizacao da vaga e ID estavel. Engajamento
        nao altera o ranking tecnico. Se houver limiar publicado, aplica corte inclusivo
        sobre o percentual bruto antes da ordenacao, total e paginacao. Antes de consultar
        vagas, aplica a completude minima vigente. Perfil insuficiente recebe estado e
        pendencias explicitos, sem lista vazia ambigua e sem calcular novos Matches.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Ranking elegivel paginado
          content:
            application/json:
              schema:
                type: object
                required: [recommendationStatus, profileCompletion, minimumProfileCompletionPercentage, completionThresholdVersion]
                properties:
                  recommendationStatus:
                    type: string
                    enum: [available, insufficient_profile_completeness]
                  profileCompletion:
                    $ref: '#/components/schemas/RecommendationProfileCompletion'
                  items:
                    type: array
                    description: Presente somente quando recommendationStatus e available.
                    items:
                      type: object
                      required: [vacancy, percentage, earnedPoints, possiblePoints, matchedRequiredCount, configurationVersion, multipliersVersion, audit]
                      properties:
                        vacancy: { $ref: '#/components/schemas/Vacancy' }
                        percentage: { type: number, minimum: 0, maximum: 100 }
                        earnedPoints: { type: number, minimum: 0 }
                        possiblePoints: { type: number, exclusiveMinimum: 0 }
                        matchedRequiredCount: { type: integer, minimum: 0 }
                        configurationVersion: { type: integer, minimum: 1 }
                        multipliersVersion: { type: integer, minimum: 1 }
                        audit: { $ref: '#/components/schemas/MatchAuditReference' }
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  limit: { type: integer, minimum: 1, maximum: 50 }
                  pages: { type: integer, minimum: 0 }
                  minimumMatchPercentage: { type: number, minimum: 0, maximum: 100, nullable: true }
                  rankingThresholdVersion: { type: integer, minimum: 1, nullable: true }
                  minimumProfileCompletionPercentage: { type: number, minimum: 0, maximum: 100, nullable: true }
                  completionThresholdVersion: { type: integer, minimum: 1, nullable: true }
        '400': { description: Paginacao invalida }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Conta nao e candidata }
        '404': { description: Cadastro de candidato inexistente }
        '409': { description: Perfil de Match nao cadastrado }
        '503': { description: Configuracao tecnica ou de completude indisponivel }
  /candidatos/me/vagas/{id}/match:
    get:
      tags: [Vacancies]
      summary: Explica o Match do candidato autenticado com uma vaga (VJ-64)
      description: >
        Reutiliza o mesmo Motor de Match dos rankings. Retorna criterios atendidos,
        gaps canonicos ordenados pela perda efetiva e motivo seguro de inelegibilidade.
        Competencias extras, indifferent, derivados, texto livre e valores importados nao
        identificados nao viram gaps. Perfil incompleto ou denominador zero produz estado
        not_calculable e percentual nulo. Distingue eligible, below_threshold, ineligible e
        not_calculable, avaliando eliminacao antes do limiar. Nao gera plano de estudos nem
        expoe dados privados. O indicador identifica esta resposta como dimensao technical_match
        e nao consulta nem incorpora engajamento.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Detalhe explicavel do Match
          content:
            application/json:
              schema:
                type: object
                required: [vacancy, indicator, audit, resultState, resultLabel, calculationStatus, percentage, earnedPoints, possiblePoints, configurationVersion, multipliersVersion, minimumMatchPercentage, rankingThresholdVersion, eligibility, metCriteria, gaps, availableCriteria]
                properties:
                  vacancy:
                    type: object
                    required: [_id, title]
                    properties:
                      _id: { type: string }
                      title: { type: string }
                  indicator:
                    type: object
                    required: [dimension, label, percentage, status]
                    properties:
                      dimension: { type: string, enum: [technical_match] }
                      label: { type: string, enum: [Match tecnico] }
                      percentage: { type: number, minimum: 0, maximum: 100, nullable: true }
                      status: { type: string, enum: [eligible, below_threshold, ineligible, not_calculable] }
                  audit: { $ref: '#/components/schemas/MatchAuditReference' }
                  resultState:
                    type: string
                    enum: [eligible, below_threshold, ineligible, not_calculable]
                  resultLabel:
                    type: string
                    enum: [Compatível, Compatibilidade baixa, Não atende critério eliminatório, Compatibilidade não calculável]
                  calculationStatus:
                    type: string
                    enum: [calculable, not_calculable]
                  percentage: { type: number, minimum: 0, maximum: 100, nullable: true }
                  earnedPoints: { type: number, minimum: 0, nullable: true }
                  possiblePoints: { type: number, minimum: 0, nullable: true }
                  configurationVersion: { type: integer, minimum: 1 }
                  multipliersVersion: { type: integer, minimum: 1 }
                  minimumMatchPercentage: { type: number, minimum: 0, maximum: 100, nullable: true }
                  rankingThresholdVersion: { type: integer, minimum: 1, nullable: true }
                  eligibility:
                    type: object
                    required: [eligible, reason]
                    properties:
                      eligible: { type: boolean, nullable: true }
                      reason: { type: object, nullable: true, additionalProperties: true }
                  metCriteria:
                    type: array
                    items: { $ref: '#/components/schemas/MatchCriterionDetail' }
                  gaps:
                    type: array
                    items: { $ref: '#/components/schemas/MatchCriterionDetail' }
                  availableCriteria:
                    type: array
                    items: { $ref: '#/components/schemas/MatchCriterionDetail' }
        '400': { description: Identificador da vaga invalido }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Conta nao e candidata }
        '404': { description: Candidato inexistente ou vaga indisponivel }
        '503': { description: Configuracao tecnica indisponivel }
  /candidatos/me/engajamento:
    get:
      tags: [Candidates]
      summary: Consulta engajamento oficial separado do Match tecnico (VJ-67/VJ-68)
      description: >
        Somente candidato ativo e validado. Usa a identidade vinculada a conta e rejeita
        identificadores externos na query. Consulta a origem com credenciais do servidor,
        aplica timeout e cache apenas em memoria, filtra campos autorizados e nunca persiste
        copia editavel. Retorna estado explicito sem inventar zeros quando nao ha dados ou a
        origem esta indisponivel. Categoria e exibida somente quando recebida oficialmente;
        dados brutos nunca geram classificacao implicita e nao alteram Match ou ranking.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado da consulta oficial de engajamento
          content:
            application/json:
              schema:
                type: object
                required: [engagement]
                properties:
                  engagement:
                    type: object
                    required: [status, readOnly, indicator, data, referenceAt, retrievedAt, cache]
                    properties:
                      status:
                        type: string
                        enum: [available, no_data, unavailable]
                      readOnly: { type: boolean, enum: [true] }
                      indicator:
                        type: object
                        required: [dimension, label, category, displayValue, categorySource, availability]
                        properties:
                          dimension: { type: string, enum: [training_engagement] }
                          label: { type: string, enum: [Engajamento na formacao] }
                          category: { type: string, nullable: true }
                          displayValue: { type: string }
                          categorySource: { type: string, enum: [official], nullable: true }
                          availability: { type: string, enum: [available, no_data, unavailable] }
                      data:
                        type: object
                        nullable: true
                        additionalProperties: false
                        properties:
                          engagementLevel: { type: string }
                          cohort: { type: string }
                          challengesCompleted: { type: number }
                          totalChallenges: { type: number }
                          score: { type: number }
                          participation:
                            oneOf:
                              - { type: string }
                              - { type: number }
                          history:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                type: { type: string }
                                title: { type: string }
                                status: { type: string }
                                occurredAt: { type: string }
                                score: { type: number }
                          projects:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                name: { type: string }
                                description: { type: string }
                                url: { type: string }
                                status: { type: string }
                                completedAt: { type: string }
                      referenceAt: { type: string, format: date-time, nullable: true }
                      retrievedAt: { type: string, format: date-time }
                      reason:
                        type: string
                        enum: [student_link_missing, integration_not_configured, student_not_found, authorized_data_absent, origin_unavailable]
                      cache:
                        type: object
                        required: [hit, ttlSeconds]
                        properties:
                          hit: { type: boolean }
                          ttlSeconds: { type: number, minimum: 0, maximum: 3600 }
        '400': { description: Identificador externo enviado na query }
        '401': { description: JWT ausente, invalido ou conta inativa }
        '403': { description: Papel, cadastro ou validacao de candidato ausente }
  /vagas/{id}/candidatos/ranking:
    get:
      tags: [Vacancies]
      summary: Lista candidatos ativos por Match com Top 3, 5 ou 10 (VJ-50/VJ-63)
      description: >
        Reutiliza o mesmo calculo tecnico do ranking do candidato, com a vaga como
        referencia de requisitos e denominador. Recrutador vinculado consulta apenas
        vaga COMPANY da propria empresa ativa; admin pode consultar origens validas.
        Exclui candidatos inativos, sem perfil ou inelegiveis antes de ordenar e limitar.
        O limit aceita Top 3, Top 5 e Top 10. Ordena por percentual, requisitos obrigatorios
        atendidos, atualizacao do perfil e ID estavel. Engajamento nao participa do MVP.
        Se houver limiar publicado, aplica corte inclusivo sobre o percentual bruto antes
        da ordenacao, total e paginacao.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Ranking elegivel paginado
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit, pages, minimumMatchPercentage, rankingThresholdVersion]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [candidate, percentage, earnedPoints, possiblePoints, matchedRequiredCount, configurationVersion, multipliersVersion, audit]
                      properties:
                        candidate:
                          type: object
                          required: [_id, name]
                          properties:
                            _id: { type: string }
                            name: { type: string }
                        percentage: { type: number, minimum: 0, maximum: 100 }
                        earnedPoints: { type: number, minimum: 0 }
                        possiblePoints: { type: number, exclusiveMinimum: 0 }
                        matchedRequiredCount: { type: integer, minimum: 0 }
                        configurationVersion: { type: integer, minimum: 1 }
                        multipliersVersion: { type: integer, minimum: 1 }
                        audit: { $ref: '#/components/schemas/MatchAuditReference' }
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  limit: { type: integer, minimum: 1, maximum: 50 }
                  pages: { type: integer, minimum: 0 }
                  minimumMatchPercentage: { type: number, minimum: 0, maximum: 100, nullable: true }
                  rankingThresholdVersion: { type: integer, minimum: 1, nullable: true }
        '400': { description: ID ou paginacao invalidos }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Sem permissao empresarial ou administrativa }
        '404': { description: Vaga inexistente ou indisponivel }
        '503': { description: Configuracao tecnica indisponivel }
  /perfil-match/configuracao:
    put:
      tags: [Match Profile]
      summary: Publica configuracao versionada do Perfil de Match (VJ-28)
      description: >
        Apenas administrador autenticado. Exige exatamente as 22 chaves tecnicas iniciais;
        cada campo tem peso inteiro positivo e uma lista de opcoes canonicas. Repetir
        configuracao identica retorna a mesma versao. IDs publicados nao podem ser removidos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchProfileConfigurationRequest'
      responses:
        '200':
          description: Configuracao publicada ou repeticao idempotente
          content:
            application/json:
              schema:
                type: object
                required: [configuration]
                properties:
                  configuration:
                    $ref: '#/components/schemas/MatchProfileConfiguration'
        '400':
          description: Campo, peso, opcao ou corpo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente, invalido ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel diferente de admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Alias em conflito, ID removido ou publicacao concorrente diferente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /vagas/{id}/status:
    patch:
      tags: [Vacancies]
      summary: Altera o status da vaga com trilha de auditoria (VJ-44)
      description: >
        Requer JWT. Administradores podem publicar, rejeitar e controlar vagas de qualquer
        origem. Recrutadores verificados podem pausar, retomar ou remover apenas vagas
        COMPANY da sua empresa ativa. Reativar vaga expirada exige prorrogacao do prazo,
        revalidacao do perfil e motivo expresso por administrador. O corpo nao aceita
        origem, perfil tecnico ou dados cadastrais. Conflitos concorrentes retornam 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              additionalProperties: false
              properties:
                status: { type: string, enum: [active, paused, expired, removed, rejected] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Status alterado e transicao auditada
          content:
            application/json:
              schema:
                type: object
                properties:
                  vacancy:
                    $ref: '#/components/schemas/Vacancy'
        '400': { description: ID, status, motivo ou corpo invalidos }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Sem permissao para origem, empresa ou transicao }
        '404': { description: Vaga inexistente }
        '409': { description: Transicao invalida, perfil inapto ou alteracao concorrente }
  /vagas/{id}/requisitos:
    patch:
      tags: [Vacancies]
      summary: Classifica os requisitos tecnicos da vaga (VJ-46)
      description: >
        Admin pode classificar vagas de qualquer origem; recrutador ativo e vinculado
        apenas vagas COMPANY da propria empresa ativa. A classificacao substitui o
        conjunto completo de requisitos da vaga e incrementa a revisao auditada.
        IDs devem existir nos valores canonicos ja registrados. Vagas importadas sem
        evidencia de importancia permanecem pendentes de classificacao. eliminatory e
        opcional e falso por padrao; somente required ou desirable podem recebe-lo.
        Quando a politica MATCH_ELIMINATORY_ENABLED esta ativa, ausencia do requisito
        torna o candidato inelegivel no ranking sem penalidade adicional no percentual.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirements, reason]
              additionalProperties: false
              properties:
                requirements:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/VacancyRequirement' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Requisitos classificados e revisao incrementada
          content:
            application/json:
              schema:
                type: object
                properties:
                  vacancy: { $ref: '#/components/schemas/Vacancy' }
        '400': { description: Corpo, importancia ou ID invalido }
        '401': { description: JWT ausente ou invalido }
        '403': { description: Sem permissao sobre a vaga }
        '404': { description: Vaga inexistente }
        '409': { description: Competencia duplicada, vaga encerrada ou revisao concorrente }
        '503': { description: Configuracao tecnica indisponivel }
  /empresas/{id}/vagas:
    post:
      tags: [Vacancies]
      summary: Cadastra vaga propria pendente (VJ-42)
      description: >
        Exige conta company ativa e verificada, vinculo recruiter ativo e empresa active.
        A origem COMPANY, o status pending, a empresa e o autor sao definidos pelo servidor.
        Valores do Perfil de Match usam IDs canonicos da configuracao VJ-28 mais recente;
        aliases publicados sao convertidos ao mesmo ID. Nao calcula pontuacao nem publica
        a vaga no ranking. A referencia operacional e unica por empresa atual.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da empresa ativa
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyVacancyRequest'
      responses:
        '201':
          description: Vaga propria criada como pending
          content:
            application/json:
              schema:
                type: object
                required: [vacancy]
                properties:
                  vacancy:
                    $ref: '#/components/schemas/Vacancy'
        '400':
          description: Corpo, localizacao, modalidade ou competencia fora do catalogo invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente, invalido ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem papel company, vinculo autorizado ou empresa ativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Referencia de vaga duplicada nesta empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /empresas:
    post:
      tags: [Companies]
      summary: Registra empresa pendente (VJ-37)
      description: >
        Exige conta ativa com papel admin. Registra entidade Empresa independente de User
        e Candidate, sempre com status pending. Responsavel e contato, nao credencial.
        Nao cria usuario de empresa. Papel company sozinho nao libera acesso a candidatos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRegistrationRequest'
      responses:
        '201':
          description: Empresa criada com status pending
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Campos obrigatorios, email, URL ou corpo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente ou invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel diferente de admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email corporativo ja cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /empresas/{id}/usuarios:
    post:
      tags: [Companies]
      summary: Vincula o primeiro recrutador verificado a empresa (VJ-38)
      description: >
        Exige conta admin ativa. Vincula uma conta company existente, ativa e com email
        previamente verificado. Nao cria credenciais ou envia convite. Empresa pending
        pode receber o vinculo, mas acesso aos candidatos exige empresa active, conta
        ativa e vinculo active. O MVP limita a um vinculo ativo por empresa e por usuario.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da empresa
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              additionalProperties: false
              properties:
                userId:
                  type: string
                  pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '201':
          description: Vinculo ativo criado; sem credenciais ou prova de identidade
          content:
            application/json:
              schema:
                type: object
                required: [membership, user]
                properties:
                  membership:
                    $ref: '#/components/schemas/CompanyUser'
                  user:
                    $ref: '#/components/schemas/PublicCompanyUser'
        '400':
          description: Identificador ou corpo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nao admin ou conta nao verificada, inativa ou sem papel company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Empresa inexistente ou excluida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Empresa inativa ou bloqueada, ou vinculo ativo duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /empresas/{id}/cadastro:
    delete:
      tags: [Companies]
      summary: Encerra cadastro empresarial e revoga recrutadores (VJ-41)
      description: >
        Exige JWT de admin ativo ou recrutador ativo com permissao explicita de exclusao
        para esta empresa. Define status inactive, registra deletedAt e inativa os vinculos
        ativos na mesma transacao. Nao exclui User, candidatos ou outras empresas.
        Acesso empresarial a candidatos cessa imediatamente, mesmo com JWT valido.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da empresa atual
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '204':
          description: Cadastro encerrado sem corpo
        '400':
          description: Identificador de empresa malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Perfil nao autorizado ou recrutador sem permissao explicita para esta empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Empresa inexistente ou ja excluida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Companies]
      summary: Apresenta cadastro empresarial e usuarios publicos permitidos (VJ-40)
      description: >
        Exige JWT de conta ativa. Admin pode consultar qualquer empresa atual; recrutador
        pode consultar somente empresa com vinculo ativo e autorizado, inclusive se ela
        estiver pending, inactive ou blocked. Esta consulta nao libera acesso a candidatos.
        Retorna apenas campos publicos da empresa e lista de usuarios vinculados permitidos.
        A operacao e somente leitura.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da empresa
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: Dados empresariais e lista de usuarios publicos permitidos
          content:
            application/json:
              schema:
                type: object
                required: [company, usuarios]
                additionalProperties: false
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicCompanyUser'
        '400':
          description: Identificador de empresa malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Perfil nao autorizado ou recrutador sem vinculo ativo com esta empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Empresa inexistente ou excluida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Companies]
      summary: Edita cadastro empresarial e dados publicos do recrutador (VJ-39)
      description: >
        Exige JWT ativo. Recrutador verificado e vinculado pode editar empresa e seu nome;
        admin pode editar empresa e transitar status. Ativacao exige referencia de verificacao
        administrativa. Troca de email ou senha de login usa o fluxo User existente. A edicao
        combinada e atomica e requer MongoDB com suporte a transacoes.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da empresa
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRegistrationUpdateRequest'
      responses:
        '200':
          description: Cadastro atualizado sem campos internos ou credenciais
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
                  usuarioAtual:
                    $ref: '#/components/schemas/PublicCompanyUser'
        '400':
          description: Campos, email, URL, status ou referencia de verificacao invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Usuario sem vinculo, de outra empresa, ou tentativa de autoativacao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Empresa inexistente ou excluida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email corporativo duplicado ou transicao de status proibida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos:
    post:
      tags: [Candidates]
      summary: Cadastra um candidato (VJ-22)
      description: >
        Exige usuario autenticado, ativo e com papel candidate. Nome e email sao obrigatorios; o email deve
        coincidir com a conta autenticada. A validacao usa uma base de alunos confiavel,
        por email autorizado, codigo de compra ou identificador confiavel aprovado,
        nunca flags enviadas pelo cliente. Sem validacao concluida, o status e
        pending_validation; aluno autorizado recebe incomplete_profile. Nenhum cadastro
        e ativado automaticamente. Campos opcionais omitidos ou null sao persistidos
        como UNKNOWN. Codigo de compra e identificador confiavel, quando enviados,
        nao sao persistidos no candidato.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRegistrationRequest'
      responses:
        '201':
          description: Candidato criado, pendente de validacao ou com perfil incompleto
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                properties:
                  candidate:
                    $ref: '#/components/schemas/Candidate'
        '400':
          description: Dados obrigatorios invalidos, email diferente da conta ou campos nao permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token invalido, ausente ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Conta autenticada nao possui o papel candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Candidato ja cadastrado para o usuario ou email utilizado por candidato ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Usuario fora da base autorizada ou comprovante de aluno invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos/me/perfil-publico:
    patch:
      tags: [Candidates]
      summary: Registra ou revoga o consentimento do perfil profissional publico (VJ-74)
      description: >
        Permite somente ao candidato ativo optar explicitamente pela futura publicacao e
        selecionar cada campo autorizado. O perfil permanece privado por padrao. Email,
        telefone, comprovantes, auditoria e identificadores sensiveis nao pertencem a lista.
        Campos da formacao continuam sujeitos a permissao da fonte oficial. Toda mudanca e
        auditada internamente e invalida a versao de cache. A publicacao e independente da
        disponibilidade para buscas empresariais. Esta historia nao cria URL, slug, indexacao
        nem endpoint publico de leitura.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidatePublicProfileRequest'
      responses:
        '200':
          description: Consentimento atualizado ou revogado
          content:
            application/json:
              schema:
                type: object
                required: [publicProfile]
                properties:
                  publicProfile:
                    $ref: '#/components/schemas/CandidatePublicProfileState'
        '400': { description: Corpo, campo, duplicidade ou combinacao de consentimento invalida }
        '401': { description: JWT ausente ou invalido, ou conta inativa }
        '403': { description: Papel diferente de candidate }
        '404': { description: Cadastro atual de candidato inexistente }
        '409': { description: Candidato nao ativo ou alterado concorrentemente }
        '503': { description: Banco de dados indisponivel }

  /candidatos/me/perfil-match:
    get:
      tags: [Match Profile]
      summary: Consulta estados e completude do proprio Perfil de Match (VJ-72)
      description: >
        Retorna o perfil atual usando a versao de catalogo gravada nele. UNKNOWN representa
        campo nao respondido; false e lista vazia representam respostas explicitas. A completude
        usa somente campos tecnicos elegiveis, sem pesos e sem alterar o score do Match.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil, estados das respostas, completude e campos pendentes
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: '#/components/schemas/CandidateMatchProfile'
        '401':
          description: JWT ausente ou invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel diferente de candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cadastro ou Perfil de Match atual nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Match Profile]
      summary: Cadastra o Perfil de Match do proprio candidato (VJ-29)
      description: >
        Exige conta ativa com papel candidate e cadastro atual pendente, incompleto ou ativo.
        Usa a ultima configuracao VJ-28 publicada; aceita IDs, rotulos e aliases de catalogo,
        mas persiste apenas IDs canonicos. Campos omitidos permanecem pendentes. Nao altera
        o status nem a visibilidade para empresas. So um perfil atual por candidato.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateMatchProfileRequest'
      responses:
        '201':
          description: Perfil criado com valores canonicos e campos pendentes
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: '#/components/schemas/CandidateMatchProfile'
        '400':
          description: Corpo, campo, catalogo ou anos de experiencia invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente ou invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel diferente de candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cadastro atual de candidato nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Perfil atual ja existe ou candidato inativo/bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Match Profile]
      summary: Edita parcialmente o Perfil de Match do proprio candidato (VJ-30)
      description: >
        Somente o titular ativo da conta, com cadastro e perfil atuais, pode editar.
        Campos omitidos permanecem iguais; null volta o campo para UNKNOWN e lista vazia
        registra a resposta explicita de que nenhuma opcao se aplica.
        Valores de catalogo sao normalizados aos IDs canonicos da ultima configuracao.
        Exige If-Match com a revisao atual. A atualizacao e atomica e eleva revision.
        Nao altera o status do candidato nem os pesos da configuracao.
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Revisao atual entre aspas, por exemplo "1"
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateMatchProfileUpdateRequest'
      responses:
        '200':
          description: Perfil atualizado; ETag traz a nova revisao
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: '#/components/schemas/CandidateMatchProfile'
        '400':
          description: Revisao, corpo, campo ou valor invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente ou invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel nao candidate ou candidato inativo/bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cadastro ou Perfil de Match atual nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revisao desatualizada ou alteracao concorrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos/{id}/validacao:
    post:
      tags: [Candidates]
      summary: Valida a elegibilidade do candidato (VJ-24)
      description: >
        Exige JWT de candidato e permite validar somente o perfil vinculado a conta autenticada.
        Usa o email normalizado da conta, um codigo de compra ou outro identificador confiavel.
        Comprovantes sao comparados a hashes da base autorizada e nunca sao persistidos ou
        retornados. Aprovacao muda pending_validation somente para incomplete_profile;
        nunca ativa o candidato. Resultado inconclusivo mantem o status e retorna 202.
        Repetir uma validacao ja aprovada e idempotente. Candidatos inativos ou bloqueados
        nao podem ser validados. Falha da fonte retorna 503 sem alterar o estado anterior.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do proprio candidato
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateEligibilityRequest'
      responses:
        '200':
          description: Elegibilidade aprovada ou validacao ja aprovada anteriormente
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/Candidate'
        '202':
          description: Fonte ainda inconclusiva; candidato permanece pendente e oculto para empresas
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/Candidate'
        '400':
          description: Identificador, JSON ou comprovante malformado; campos nao permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Perfil de empresa ou tentativa de validar o candidato de outro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Candidato inativo, bloqueado, com email divergente da conta ou alterado concorrentemente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Fonte confiavel confirmou que o candidato nao e elegivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos/{id}:
    get:
      tags: [Candidates]
      summary: Visualiza um candidato conforme a permissao (VJ-25)
      description: >
        Exige JWT valido. O candidato pode consultar somente o proprio cadastro em qualquer
        status. Papel company isolado recebe 403. Somente conta company ativa com vinculo
        ativo a empresa active pode consultar candidatos ativos (VJ-38). A resposta usa uma projecao explicita, converte campos
        opcionais sem informacao em UNKNOWN e nunca inclui conta vinculada, comprovantes,
        senha, token ou detalhes internos da validacao. A operacao e somente leitura.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do candidato a consultar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      responses:
        '200':
          description: Dados cadastrais permitidos para o solicitante
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/PublicCandidate'
        '400':
          description: Identificador de candidato malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Candidato tentou consultar outro perfil, ou company sem empresa e vinculo ativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

    patch:
      tags: [Candidates]
      summary: Altera parcialmente o proprio candidato (VJ-26)
      description: >
        Exige JWT valido de candidato e permite alterar somente o cadastro vinculado a
        conta autenticada. Campos omitidos permanecem inalterados e controles do servidor
        sao rejeitados. Elegibilidade aprovada com todos os dados minimos produz status
        active; sem os dados minimos produz incomplete_profile. Elegibilidade nao aprovada
        mantem pending_validation. Inativos e bloqueados nao podem ser editados. Alterar o
        email atualiza conta e candidato na mesma transacao, arquiva internamente a validacao
        anterior e reinicia a elegibilidade como pending. A resposta nunca inclui o historico,
        conta vinculada ou detalhes internos de validacao.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do proprio candidato
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateUpdateRequest'
      responses:
        '200':
          description: Cadastro atualizado e status recalculado pelo servidor
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/PublicCandidate'
        '400':
          description: Identificador, corpo, campo ou valor invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel sem permissao ou tentativa de alterar outro candidato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email em uso, candidato inativo/bloqueado ou alteracao concorrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco indisponivel ou sem suporte a transacao necessaria para alterar email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Candidates]
      summary: Exclui logicamente o proprio candidato (VJ-27)
      description: >
        Exige JWT valido de uma conta ativa com papel candidate e permite excluir somente o
        cadastro vinculado ao titular. Candidatos pending_validation, incomplete_profile ou
        active passam atomicamente para inactive e recebem uma data interna de exclusao. A
        resposta nao possui corpo. O registro deixa imediatamente de aparecer para empresas,
        buscas e match, mas a conta, as credenciais e a base autorizada de alunos permanecem
        ativas. O email e o usuario podem originar um novo cadastro, com novo identificador e
        nova validacao. Repetir a exclusao retorna 404. O endpoint nao desbloqueia, reativa nem
        aceita status definido pelo cliente.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do proprio candidato
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      responses:
        '204':
          description: Candidato excluido logicamente; resposta sem corpo
        '400':
          description: Identificador de candidato malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel sem permissao ou tentativa de excluir outro candidato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato inexistente ou ja inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Candidato bloqueado nao pode ser excluido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /usuarios/{id}:
    get:
      tags: [Users]
      summary: Consulta os dados publicos de um usuario (VJ-6)
      description: >
        Exige JWT valido e permite consultar qualquer usuario existente, inclusive
        outro usuario. O contrato publico contem somente _id e name. Email, role,
        status, datas internas, senha, hash e tokens nao sao retornados.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do usuario a consultar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      responses:
        '200':
          description: Dados publicos do usuario
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '400':
          description: Identificador de usuario malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Users]
      summary: Exclui a propria conta e o candidato vinculado (VJ-23)
      description: >
        Exige JWT valido e conta ativa. Exclui fisicamente usuario e candidatos vinculados
        numa unica transacao; requer MongoDB replica set ou Atlas. Libera os emails para
        novo cadastro e invalida o acesso com tokens antigos pela verificacao da conta no banco.
        Somente o titular pode excluir a conta, inclusive quando o papel e admin.
        Repetir DELETE do proprio id ausente com JWT ainda assinado e nao expirado retorna
        404 sem autorizar operacoes; em outras rotas o token da conta excluida retorna 401.
        JWT expirado ou invalido sempre retorna 401. Nao recebe corpo.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da propria conta
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      responses:
        '204':
          description: Usuario e candidatos vinculados excluidos; resposta sem corpo
        '400':
          description: Identificador ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente, invalido ou expirado; conta inativa ou excluida (exceto repeticao do proprio DELETE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Alvo existente pertence a outro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario inexistente ou repeticao da exclusao do proprio identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco indisponivel ou sem suporte a transacoes; exclusao nao confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Users]
      summary: Edita os dados do proprio usuario (VJ-4)
      description: >
        Exige JWT valido. Permite alterar name, email e password; campos omitidos
        permanecem inalterados. Campos nao editaveis e corpo vazio sao rejeitados.
        O usuario deve existir e pertencer ao titular do token, inclusive para administradores.
        A senha alterada e persistida com hash bcrypt e nunca aparece na resposta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do usuario a editar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Dados atualizados sem senha ou hash na resposta
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Identificador, JSON ou dados invalidos; corpo vazio ou campos nao editaveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tentativa de editar outro usuario existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario inexistente ou removido durante a edicao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja utilizado por outro usuario, inclusive em alteracoes concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (VJ-2)
      description: >
        Exige email e senha. Valida a senha contra o hash bcrypt armazenado e retorna
        um JWT HS256 com expiracao configurada por JWT_EXPIRES_IN (padrao 1d).
        Email desconhecido, senha incorreta e usuario inativo retornam a mesma mensagem
        de credenciais invalidas. Senha e hash nunca aparecem na resposta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario autenticado e token de acesso com expiracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email ou senha ausentes/invalidos ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais invalidas ou usuario inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Credenciais invalidas
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /usuarios:
    post:
      tags: [Users]
      summary: Registra um usuario (VJ-1)
      description: >
        Cadastro publico. Cria o usuario com status active e retorna seus dados sem
        senha ou token JWT. O email e unico entre todos os endpoints de cadastro,
        normalizado para minusculas e sem espacos nas extremidades.
        O status e definido pelo servidor; valores enviados pelo cliente sao ignorados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario ativo criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Campos obrigatorios ausentes ou invalidos, perfil invalido ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja cadastrado, inclusive em cadastros concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/health:
    get:
      tags: [Health]
      summary: Verifica se a API esta no ar
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Cadastra um novo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Ja existe um usuario com este email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (endpoint existente)
      description: >
        Compartilha as regras e o retorno de /login. Mantem HTTP 422 para campos
        invalidos. Usuario inativo, email desconhecido ou senha incorreta retornam
        HTTP 401 com a mesma mensagem de credenciais invalidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacao realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/users/me:
    get:
      tags: [Users]
      summary: Retorna o perfil do usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  responses:
    BadRequest:
      description: JSON invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Corpo da requisicao excede o limite permitido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dados invalidos (incluindo tentativa de cadastro com role admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Banco de dados ou dependencia temporariamente indisponivel
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MatchAuditReference:
      type: object
      description: Referencia segura para a auditoria interna e imutavel do resultado de Match.
      required: [evaluationId, executionId, algorithmVersion, calculatedAt, configurationVersions, inputRevisions]
      additionalProperties: false
      properties:
        evaluationId: { type: string, example: 66f1d86e5b47d410ca2a6f15 }
        executionId: { type: string, example: 3eb30c35-b8a4-4978-802d-8b92a52db912 }
        algorithmVersion: { type: string, pattern: '^MATCH_V[1-9][0-9]*$', example: MATCH_V1 }
        calculatedAt: { type: string, format: date-time }
        configurationVersions:
          type: object
          required: [profileCatalog, multipliers, rankingThreshold, completionThreshold]
          additionalProperties: false
          properties:
            profileCatalog: { type: integer, minimum: 1, example: 3 }
            multipliers: { type: integer, minimum: 1, example: 2 }
            rankingThreshold: { type: integer, minimum: 1, nullable: true, example: 4 }
            completionThreshold: { type: integer, minimum: 1, nullable: true, example: 2 }
        inputRevisions:
          type: object
          required: [vacancyRequirements, vacancyUpdatedAt, candidateProfile, candidateProfileUpdatedAt]
          additionalProperties: false
          properties:
            vacancyRequirements: { type: integer, minimum: 1, example: 5 }
            vacancyUpdatedAt: { type: string, format: date-time }
            candidateProfile: { type: integer, minimum: 1, nullable: true, example: 7 }
            candidateProfileUpdatedAt: { type: string, format: date-time, nullable: true }
    MatchCriterionDetail:
      type: object
      required: [field, id, label, importance, status, earnedPoints, possiblePoints, lostPoints]
      additionalProperties: false
      properties:
        field: { type: string, example: testAutomationTechnologies }
        id: { type: string, example: playwright }
        label: { type: string, example: Playwright }
        importance:
          type: string
          enum: [required, desirable]
        status:
          type: string
          enum: [met, gap, unknown]
        earnedPoints: { type: number, minimum: 0, nullable: true }
        possiblePoints: { type: number, exclusiveMinimum: 0 }
        lostPoints: { type: number, minimum: 0, nullable: true }
    MatchProfileOption:
      type: object
      required: [id, label, aliases]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_-]*$', example: cypress }
        label: { type: string, example: Cypress }
        aliases:
          type: array
          items: { type: string }
    MatchProfileFieldInput:
      type: object
      required: [weight, options]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Nome amigavel opcional; nao altera a chave tecnica persistida.
        weight: { type: integer, minimum: 1 }
        options:
          type: array
          items:
            $ref: '#/components/schemas/MatchProfileOption'
    MatchProfileConfigurationRequest:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        geographyWeights:
          type: object
          description: Pesos inteiros positivos por dimensão; publicar antes de usar restrições geográficas.
          required: [country, state, city]
          additionalProperties: false
          properties:
            country: { type: integer, minimum: 1 }
            state: { type: integer, minimum: 1 }
            city: { type: integer, minimum: 1 }
        fields:
          type: object
          description: >
            Exatamente as 22 chaves tecnicas da VJ-28. Em testAutomationTechnologies,
            publicar IDs canonicos com labels e aliases conferidos na base real;
            a proposta opcional pode ser gerada por npm run match:automation-proposal.
            Em programmingLanguages, a proposta opcional pode ser gerada por
            npm run match:programming-languages-proposal; Java, JavaScript,
            TypeScript, C, C++ e C# devem manter IDs distintos.
            O campo legado tecnologies pode publicar o label de apresentacao
            Ferramentas de QA e Gestao de Testes e a proposta pode ser gerada
            por npm run match:qa-management-proposal. Nomes nao podem se sobrepor
            automaticamente a testAutomationTechnologies.
            Uma nova publicacao deve preservar todos os IDs ja publicados.
          minProperties: 22
          maxProperties: 22
          additionalProperties:
            $ref: '#/components/schemas/MatchProfileFieldInput'
    MatchProfileConfiguration:
      type: object
      required: [_id, version, fields, createdAt]
      properties:
        geographyWeights:
          type: object
          nullable: true
          description: Pesos publicados para restrições geográficas explícitas.
        _id: { type: string }
        version: { type: integer, minimum: 1 }
        fields:
          type: array
          items:
            type: object
            required: [key, weight, options]
            properties:
              key: { type: string }
              label:
                type: string
                nullable: true
                description: Nome amigavel; a chave tecnica continua estavel.
              weight: { type: integer }
              options:
                type: array
                items:
                  $ref: '#/components/schemas/MatchProfileOption'
        createdAt: { type: string, format: date-time }
    CompanyVacancyRequest:
      type: object
      required: [reference, title, description, matchProfile]
      additionalProperties: false
      properties:
        reference: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$', maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        expiresAt: { type: string, format: date-time, nullable: true, description: Prazo futuro em UTC }
        location:
          type: object
          nullable: true
          minProperties: 1
          additionalProperties: false
          properties:
            city: { type: string, minLength: 1, maxLength: 200 }
            state: { type: string, minLength: 1, maxLength: 200 }
            country: { type: string, minLength: 1, maxLength: 200 }
        geographicRestrictions:
          type: object
          nullable: true
          minProperties: 1
          additionalProperties: false
          description: Restricoes explicitas, independentes do endereco da empresa e da modalidade.
          properties:
            country: { $ref: '#/components/schemas/GeographicRestriction' }
            state: { $ref: '#/components/schemas/GeographicRestriction' }
            city: { $ref: '#/components/schemas/GeographicRestriction' }
        matchProfile:
          type: object
          required: [values]
          additionalProperties: false
          properties:
            values:
              type: object
              minProperties: 1
              required: [type]
              description: >
                Chaves tecnicas da VJ-28. type representa modalidade; demais campos de catalogo
                aceitam ID, rotulo ou alias publicado, sempre persistido como ID canonico.
                yearsOfExperience aceita numero de 0 a 100 com uma casa decimal.
              additionalProperties: true
            requirements:
              type: array
              maxItems: 200
              description: Classificacao opcional na criacao; sem ela, vaga permanece pending e nao pode ser ativada.
              items: { $ref: '#/components/schemas/VacancyRequirement' }
    VacancyRequirement:
      type: object
      description: >
        Para campos de catalogo, use field, id canonico e importance. Para
        yearsOfExperience, use field, value numerico e importance.
      required: [field, importance]
      properties:
        field: { type: string, description: Chave tecnica da configuracao VJ-28 }
        id: { type: string, description: ID canonico; ausente em yearsOfExperience }
        value: { type: number, description: Valor numerico apenas em yearsOfExperience }
        importance: { type: string, enum: [required, desirable, indifferent] }
        eliminatory:
          type: boolean
          default: false
          description: Criterio eliminatorio explicito; invalido com importance indifferent
    Vacancy:
      type: object
      required: [_id, reference, title, description, matchProfile, origin, status]
      description: >
        Vagas COMPANY, IMPORTED e ADMIN compartilham as mesmas chaves, tipos e versao
        tecnica do Perfil de Match. A origem e procedencia sao atribuídas por fluxos
        confiaveis do servidor e nao participam do calculo tecnico. Para COMPANY,
        company e obrigatoria; para IMPORTED, importSource e importSourceId; para ADMIN,
        o autor administrativo e armazenado internamente. Sem origem verificavel,
        a vaga requer saneamento e nao fica apta ao Match. Na origem IMPORTED,
        false significa requisito nao identificado e nao aparece nos valores
        canonicos; a auditoria bruta permanece interna.
      properties:
        _id: { type: string }
        company: { type: string, nullable: true }
        importSource: { type: string, nullable: true }
        importSourceId: { type: string, nullable: true }
        reference: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: object, nullable: true }
        geographicRestrictions:
          type: object
          nullable: true
          description: Apenas dimensões declaradas participam do Match; endereço descritivo não pontua.
        matchProfile:
          type: object
          properties:
            configurationVersion: { type: integer, minimum: 1 }
            values: { type: object }
            requirements:
              type: array
              items: { $ref: '#/components/schemas/VacancyRequirement' }
        origin: { type: string, enum: [IMPORTED, COMPANY, ADMIN] }
        status: { type: string, enum: [pending, active, paused, expired, removed, rejected] }
        requirementsRevision: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
