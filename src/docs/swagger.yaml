openapi: 3.0.3
info:
  title: Vagas JL API
  description: >
    API REST que conecta profissionais de testes de software a oportunidades de trabalho,
    e permite que empresas encontrem profissionais compativeis com suas vagas.
    Inclui cadastro (VJ-1), login (VJ-2) e edicao dos proprios dados (VJ-4).
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Ambiente local
tags:
  - name: Auth
    description: Cadastro e autenticacao de usuarios
  - name: Users
    description: Cadastro e dados de usuarios
  - name: Health
    description: Verificacao de disponibilidade da API

paths:
  /usuarios/{id}:
    put:
      tags: [Users]
      summary: Edita os dados do proprio usuario (VJ-4)
      description: >
        Exige JWT valido. Permite alterar name, email e password; campos omitidos
        permanecem inalterados. Campos nao editaveis e corpo vazio sao rejeitados.
        O usuario deve existir e pertencer ao titular do token, inclusive para administradores.
        A senha alterada e persistida com hash bcrypt e nunca aparece na resposta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do usuario a editar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}  /login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (VJ-2)
      description: >
        Exige email e senha. Valida a senha contra o hash bcrypt armazenado e retorna
        um JWT HS256 com expiracao configurada por JWT_EXPIRES_IN (padrao 1d).
        Email desconhecido, senha incorreta e usuario inativo retornam a mesma mensagem
        de credenciais invalidas. Senha e hash nunca aparecem na resposta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario autenticado e token de acesso com expiracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email ou senha ausentes/invalidos ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais invalidas ou usuario inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Credenciais invalidas
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /usuarios:
    post:
      tags: [Users]
      summary: Registra um usuario (VJ-1)
      description: >
        Cadastro publico. Cria o usuario com status active e retorna seus dados sem
        senha ou token JWT. O email e unico entre todos os endpoints de cadastro,
        normalizado para minusculas e sem espacos nas extremidades.
        O status e definido pelo servidor; valores enviados pelo cliente sao ignorados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario ativo criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Campos obrigatorios ausentes ou invalidos, perfil invalido ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja cadastrado, inclusive em cadastros concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/health:
    get:
      tags: [Health]
      summary: Verifica se a API esta no ar
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Cadastra um novo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Ja existe um usuario com este email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (endpoint existente)
      description: >
        Compartilha as regras e o retorno de /login. Mantem HTTP 422 para campos
        invalidos. Usuario inativo, email desconhecido ou senha incorreta retornam
        HTTP 401 com a mesma mensagem de credenciais invalidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacao realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/users/me:
    get:
      tags: [Users]
      summary: Retorna o perfil do usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  responses:
    BadRequest:
      description: JSON invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Corpo da requisicao excede o limite permitido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dados invalidos (incluindo tentativa de cadastro com role admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Banco de dados temporariamente indisponivel
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Nome nao vazio apos remover espacos nas extremidades
          example: Maria Silva
        email:
          type: string
          format: email
          description: Email unico, normalizado para minusculas e sem espacos nas extremidades
          example: maria.nova@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: Maximo de 72 bytes em UTF-8; mesmos limites do cadastro
          example: novaSenhaForte123
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b7
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        role:
          type: string
          enum: [candidate, company, admin]
          example: candidate
        status:
          type: string
          enum: [active, inactive]
          default: active
          readOnly: true
          example: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123
        role:
          type: string
          enum: [candidate, company]
          default: candidate
          example: candidate

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT HS256 com sub, role, iat e exp; expiracao definida por JWT_EXPIRES_IN
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

          example: 6512f1e2b3a1c2d3e4f5a6b7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Dados atualizados sem senha ou hash na resposta
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Identificador, JSON ou dados invalidos; corpo vazio ou campos nao editaveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tentativa de editar outro usuario existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario inexistente ou removido durante a edicao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja utilizado por outro usuario, inclusive em alteracoes concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (VJ-2)
      description: >
        Exige email e senha. Valida a senha contra o hash bcrypt armazenado e retorna
        um JWT HS256 com expiracao configurada por JWT_EXPIRES_IN (padrao 1d).
        Email desconhecido, senha incorreta e usuario inativo retornam a mesma mensagem
        de credenciais invalidas. Senha e hash nunca aparecem na resposta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario autenticado e token de acesso com expiracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email ou senha ausentes/invalidos ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais invalidas ou usuario inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Credenciais invalidas
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /usuarios:
    post:
      tags: [Users]
      summary: Registra um usuario (VJ-1)
      description: >
        Cadastro publico. Cria o usuario com status active e retorna seus dados sem
        senha ou token JWT. O email e unico entre todos os endpoints de cadastro,
        normalizado para minusculas e sem espacos nas extremidades.
        O status e definido pelo servidor; valores enviados pelo cliente sao ignorados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario ativo criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Campos obrigatorios ausentes ou invalidos, perfil invalido ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja cadastrado, inclusive em cadastros concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/health:
    get:
      tags: [Health]
      summary: Verifica se a API esta no ar
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/register:
