openapi: 3.0.3
info:
  title: Vagas JL API
  description: >
    API REST que conecta profissionais de testes de software a oportunidades de trabalho,
    e permite que empresas encontrem profissionais compativeis com suas vagas.
    Inclui cadastro (VJ-1), login (VJ-2), edicao (VJ-4), consulta publica autenticada (VJ-6),
    cadastro de candidatos (VJ-22), exclusao da propria conta (VJ-23), validacao de
    elegibilidade (VJ-24), visualizacao individual (VJ-25), alteracao (VJ-26) e exclusao
    logica de candidatos (VJ-27), configuracao versionada do Perfil de Match (VJ-28)
    e cadastro (VJ-29), edicao (VJ-30) e consulta (VJ-31) do Perfil de Match do candidato.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Ambiente local
tags:
  - name: Match Profile
    description: Configuracao administrativa dos campos, pesos e catalogos compartilhados
  - name: Candidates
    description: Cadastro, validacao, visualizacao, alteracao e exclusao logica de candidatos
  - name: Auth
    description: Cadastro e autenticacao de usuarios
  - name: Users
    description: Cadastro e dados de usuarios
  - name: Health
    description: Verificacao de disponibilidade da API

paths:
  /perfil-match/configuracao:
    put:
      tags: [Match Profile]
      summary: Publica configuracao versionada do Perfil de Match (VJ-28)
      description: >
        Apenas administrador autenticado. Exige exatamente as 22 chaves tecnicas iniciais;
        cada campo tem peso inteiro positivo e uma lista de opcoes canonicas. Opcoes do catalogo
        sao fornecidas pelo produto, nao geradas pela API. Repetir configuracao identica retorna
        a mesma versao. Alteracao publica nova versao imutavel. IDs canonicos anteriores nao podem
        ser removidos. Alias compartilhado ou transferido entre IDs no mesmo campo retorna 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchProfileConfigurationRequest'
      responses:
        '200':
          description: Configuracao publicada ou repeticao idempotente
          content:
            application/json:
              schema:
                type: object
                required: [configuration]
                properties:
                  configuration:
                    $ref: '#/components/schemas/MatchProfileConfiguration'
        '400':
          description: Campo, peso, opcao ou corpo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente, invalido ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel diferente de admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Alias em conflito, ID removido ou publicacao concorrente diferente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos:
    post:
      tags: [Candidates]
      summary: Cadastra um candidato (VJ-22)
      description: >
        Exige usuario autenticado, ativo e com papel candidate. Nome e email sao obrigatorios; o email deve
        coincidir com a conta autenticada. A validacao usa uma base de alunos confiavel,
        por email autorizado, codigo de compra ou identificador confiavel aprovado,
        nunca flags enviadas pelo cliente. Sem validacao concluida, o status e
        pending_validation; aluno autorizado recebe incomplete_profile. Nenhum cadastro
        e ativado automaticamente. Campos opcionais omitidos ou null sao persistidos
        como UNKNOWN. Codigo de compra e identificador confiavel, quando enviados,
        nao sao persistidos no candidato.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRegistrationRequest'
      responses:
        '201':
          description: Candidato criado, pendente de validacao ou com perfil incompleto
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                properties:
                  candidate:
                    $ref: '#/components/schemas/Candidate'
        '400':
          description: Dados obrigatorios invalidos, email diferente da conta ou campos nao permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token invalido, ausente ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Conta autenticada nao possui o papel candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Candidato ja cadastrado para o usuario ou email utilizado por candidato ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Usuario fora da base autorizada ou comprovante de aluno invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos/me/perfil-match:
    post:
      tags: [Match Profile]
      summary: Cadastra o Perfil de Match do proprio candidato (VJ-29)
      description: >
        Exige conta ativa com papel candidate e cadastro atual pendente, incompleto ou ativo.
        Usa a ultima configuracao VJ-28 publicada; aceita IDs, rotulos e aliases de catalogo,
        mas persiste apenas IDs canonicos. Campos omitidos permanecem pendentes. Nao altera
        o status nem a visibilidade para empresas. So um perfil atual por candidato.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateMatchProfileRequest'
      responses:
        '201':
          description: Perfil criado com valores canonicos e campos pendentes
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: '#/components/schemas/CandidateMatchProfile'
        '400':
          description: Corpo, campo, catalogo ou anos de experiencia invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente ou invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel diferente de candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cadastro atual de candidato nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Perfil atual ja existe ou candidato inativo/bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Match Profile]
      summary: Edita parcialmente o Perfil de Match do proprio candidato (VJ-30)
      description: >
        Somente o titular ativo da conta, com cadastro e perfil atuais, pode editar.
        Campos omitidos permanecem iguais; null ou lista vazia remove o valor informado.
        Valores de catalogo sao normalizados aos IDs canonicos da ultima configuracao.
        Exige If-Match com a revisao atual. A atualizacao e atomica e eleva revision.
        Nao altera o status do candidato nem os pesos da configuracao.
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Revisao atual entre aspas, por exemplo "1"
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateMatchProfileUpdateRequest'
      responses:
        '200':
          description: Perfil atualizado; ETag traz a nova revisao
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: '#/components/schemas/CandidateMatchProfile'
        '400':
          description: Revisao, corpo, campo ou valor invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente ou invalido, ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel nao candidate ou candidato inativo/bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cadastro ou Perfil de Match atual nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revisao desatualizada ou alteracao concorrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos/{id}/perfil-match:
    get:
      tags: [Match Profile]
      summary: Consulta o Perfil de Match permitido do candidato (VJ-31)
      description: >
        O titular visualiza seu perfil atual. Empresa visualiza somente candidato active
        com perfil atual apto (ao menos um campo informado); demais casos retornam 404
        sem revelar a causa. A resposta tem as 22 chaves com IDs canonicos e rotulos
        publicos, ou null para nao informado. Nao retorna pesos, aliases, auditoria ou score.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do candidato
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: Perfil publico permitido
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                additionalProperties: false
                properties:
                  profile:
                    $ref: '#/components/schemas/PublicCandidateMatchProfile'
        '400':
          description: Identificador malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente, invalido ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Outro candidato ou papel nao permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Perfil indisponivel sem revelar a causa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos/{id}/validacao:
    post:
      tags: [Candidates]
      summary: Valida a elegibilidade do candidato (VJ-24)
      description: >
        Exige JWT de candidato e permite validar somente o perfil vinculado a conta autenticada.
        Usa o email normalizado da conta, um codigo de compra ou outro identificador confiavel.
        Comprovantes sao comparados a hashes da base autorizada e nunca sao persistidos ou
        retornados. Aprovacao muda pending_validation somente para incomplete_profile;
        nunca ativa o candidato. Resultado inconclusivo mantem o status e retorna 202.
        Repetir uma validacao ja aprovada e idempotente. Candidatos inativos ou bloqueados
        nao podem ser validados. Falha da fonte retorna 503 sem alterar o estado anterior.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do proprio candidato
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateEligibilityRequest'
      responses:
        '200':
          description: Elegibilidade aprovada ou validacao ja aprovada anteriormente
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/Candidate'
        '202':
          description: Fonte ainda inconclusiva; candidato permanece pendente e oculto para empresas
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/Candidate'
        '400':
          description: Identificador, JSON ou comprovante malformado; campos nao permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Perfil de empresa ou tentativa de validar o candidato de outro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Candidato inativo, bloqueado, com email divergente da conta ou alterado concorrentemente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Fonte confiavel confirmou que o candidato nao e elegivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /candidatos/{id}:
    get:
      tags: [Candidates]
      summary: Visualiza um candidato conforme a permissao (VJ-25)
      description: >
        Exige JWT valido de candidato ou empresa. O candidato pode consultar somente o
        proprio cadastro em qualquer status e recebe tambem o status atual. A empresa
        consulta somente candidatos ativos; candidato inexistente ou com qualquer outro
        status produz o mesmo 404. A resposta usa uma projecao explicita, converte campos
        opcionais sem informacao em UNKNOWN e nunca inclui conta vinculada, comprovantes,
        senha, token ou detalhes internos da validacao. A operacao e somente leitura.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do candidato a consultar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      responses:
        '200':
          description: Dados cadastrais permitidos para o solicitante
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/PublicCandidate'
        '400':
          description: Identificador de candidato malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Candidato tentou consultar outro perfil ou papel sem permissao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato inexistente ou nao ativo para uma empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

    patch:
      tags: [Candidates]
      summary: Altera parcialmente o proprio candidato (VJ-26)
      description: >
        Exige JWT valido de candidato e permite alterar somente o cadastro vinculado a
        conta autenticada. Campos omitidos permanecem inalterados e controles do servidor
        sao rejeitados. Elegibilidade aprovada com todos os dados minimos produz status
        active; sem os dados minimos produz incomplete_profile. Elegibilidade nao aprovada
        mantem pending_validation. Inativos e bloqueados nao podem ser editados. Alterar o
        email atualiza conta e candidato na mesma transacao, arquiva internamente a validacao
        anterior e reinicia a elegibilidade como pending. A resposta nunca inclui o historico,
        conta vinculada ou detalhes internos de validacao.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do proprio candidato
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateUpdateRequest'
      responses:
        '200':
          description: Cadastro atualizado e status recalculado pelo servidor
          content:
            application/json:
              schema:
                type: object
                required: [candidate]
                additionalProperties: false
                properties:
                  candidate:
                    $ref: '#/components/schemas/PublicCandidate'
        '400':
          description: Identificador, corpo, campo ou valor invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel sem permissao ou tentativa de alterar outro candidato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email em uso, candidato inativo/bloqueado ou alteracao concorrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco indisponivel ou sem suporte a transacao necessaria para alterar email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Candidates]
      summary: Exclui logicamente o proprio candidato (VJ-27)
      description: >
        Exige JWT valido de uma conta ativa com papel candidate e permite excluir somente o
        cadastro vinculado ao titular. Candidatos pending_validation, incomplete_profile ou
        active passam atomicamente para inactive e recebem uma data interna de exclusao. A
        resposta nao possui corpo. O registro deixa imediatamente de aparecer para empresas,
        buscas e match, mas a conta, as credenciais e a base autorizada de alunos permanecem
        ativas. O email e o usuario podem originar um novo cadastro, com novo identificador e
        nova validacao. Repetir a exclusao retorna 404. O endpoint nao desbloqueia, reativa nem
        aceita status definido pelo cliente.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do proprio candidato
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b6
      responses:
        '204':
          description: Candidato excluido logicamente; resposta sem corpo
        '400':
          description: Identificador de candidato malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado; conta inexistente ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Papel sem permissao ou tentativa de excluir outro candidato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidato inexistente ou ja inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Candidato bloqueado nao pode ser excluido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /usuarios/{id}:
    get:
      tags: [Users]
      summary: Consulta os dados publicos de um usuario (VJ-6)
      description: >
        Exige JWT valido e permite consultar qualquer usuario existente, inclusive
        outro usuario. O contrato publico contem somente _id e name. Email, role,
        status, datas internas, senha, hash e tokens nao sao retornados.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do usuario a consultar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      responses:
        '200':
          description: Dados publicos do usuario
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '400':
          description: Identificador de usuario malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Users]
      summary: Exclui a propria conta e o candidato vinculado (VJ-23)
      description: >
        Exige JWT valido e conta ativa. Exclui fisicamente usuario e candidatos vinculados
        numa unica transacao; requer MongoDB replica set ou Atlas. Libera os emails para
        novo cadastro e invalida o acesso com tokens antigos pela verificacao da conta no banco.
        Somente o titular pode excluir a conta, inclusive quando o papel e admin.
        Repetir DELETE do proprio id ausente com JWT ainda assinado e nao expirado retorna
        404 sem autorizar operacoes; em outras rotas o token da conta excluida retorna 401.
        JWT expirado ou invalido sempre retorna 401. Nao recebe corpo.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da propria conta
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      responses:
        '204':
          description: Usuario e candidatos vinculados excluidos; resposta sem corpo
        '400':
          description: Identificador ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente, invalido ou expirado; conta inativa ou excluida (exceto repeticao do proprio DELETE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Alvo existente pertence a outro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario inexistente ou repeticao da exclusao do proprio identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco indisponivel ou sem suporte a transacoes; exclusao nao confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Users]
      summary: Edita os dados do proprio usuario (VJ-4)
      description: >
        Exige JWT valido. Permite alterar name, email e password; campos omitidos
        permanecem inalterados. Campos nao editaveis e corpo vazio sao rejeitados.
        O usuario deve existir e pertencer ao titular do token, inclusive para administradores.
        A senha alterada e persistida com hash bcrypt e nunca aparece na resposta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do usuario a editar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Dados atualizados sem senha ou hash na resposta
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Identificador, JSON ou dados invalidos; corpo vazio ou campos nao editaveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tentativa de editar outro usuario existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario inexistente ou removido durante a edicao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja utilizado por outro usuario, inclusive em alteracoes concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (VJ-2)
      description: >
        Exige email e senha. Valida a senha contra o hash bcrypt armazenado e retorna
        um JWT HS256 com expiracao configurada por JWT_EXPIRES_IN (padrao 1d).
        Email desconhecido, senha incorreta e usuario inativo retornam a mesma mensagem
        de credenciais invalidas. Senha e hash nunca aparecem na resposta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario autenticado e token de acesso com expiracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email ou senha ausentes/invalidos ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais invalidas ou usuario inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Credenciais invalidas
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /usuarios:
    post:
      tags: [Users]
      summary: Registra um usuario (VJ-1)
      description: >
        Cadastro publico. Cria o usuario com status active e retorna seus dados sem
        senha ou token JWT. O email e unico entre todos os endpoints de cadastro,
        normalizado para minusculas e sem espacos nas extremidades.
        O status e definido pelo servidor; valores enviados pelo cliente sao ignorados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario ativo criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Campos obrigatorios ausentes ou invalidos, perfil invalido ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja cadastrado, inclusive em cadastros concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/health:
    get:
      tags: [Health]
      summary: Verifica se a API esta no ar
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Cadastra um novo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Ja existe um usuario com este email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (endpoint existente)
      description: >
        Compartilha as regras e o retorno de /login. Mantem HTTP 422 para campos
        invalidos. Usuario inativo, email desconhecido ou senha incorreta retornam
        HTTP 401 com a mesma mensagem de credenciais invalidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacao realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/users/me:
    get:
      tags: [Users]
      summary: Retorna o perfil do usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  responses:
    BadRequest:
      description: JSON invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Corpo da requisicao excede o limite permitido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dados invalidos (incluindo tentativa de cadastro com role admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Banco de dados ou dependencia temporariamente indisponivel
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MatchProfileOption:
      type: object
      required: [id, label, aliases]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
          example: cypress
        label:
          type: string
          example: Cypress
        aliases:
          type: array
          items:
            type: string
          example: [Cypress.io, Cypress Framework]
    MatchProfileFieldInput:
      type: object
      required: [weight, options]
      additionalProperties: false
      properties:
        weight:
          type: integer
          minimum: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/MatchProfileOption'
    MatchProfileConfigurationRequest:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields:
          type: object
          description: >
            Exatamente as chaves type, agile, programming, automation, webTesting, apiTesting,
            mobileTesting, desktopTesting, higherEducationDegree, english, spanish,
            yearsOfExperience, continuousIntegration, certification,
            testAutomationTechnologies, tecnologies, programmingLanguages, genAITools,
            level, classification, role e specialization. A grafia tecnologies e intencional
            para preservar o contrato inicial.
          minProperties: 22
          maxProperties: 22
          additionalProperties:
            $ref: '#/components/schemas/MatchProfileFieldInput'
    MatchProfileConfiguration:
      type: object
      required: [_id, version, fields, createdAt]
      properties:
        _id:
          type: string
        version:
          type: integer
          minimum: 1
        fields:
          type: array
          items:
            type: object
            required: [key, weight, options]
            properties:
              key:
                type: string
              weight:
                type: integer
              options:
                type: array
                items:
                  $ref: '#/components/schemas/MatchProfileOption'
        createdAt:
          type: string
          format: date-time
    MatchProfileChoices:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 100
        - type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
    CandidateMatchProfileRequest:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          description: Catalogos aceitam somente valores publicados; chaves omitidas ficam pendentes.
          additionalProperties: false
          properties:
            type: { $ref: '#/components/schemas/MatchProfileChoices' }
            agile: { $ref: '#/components/schemas/MatchProfileChoices' }
            programming: { $ref: '#/components/schemas/MatchProfileChoices' }
            automation: { $ref: '#/components/schemas/MatchProfileChoices' }
            webTesting: { $ref: '#/components/schemas/MatchProfileChoices' }
            apiTesting: { $ref: '#/components/schemas/MatchProfileChoices' }
            mobileTesting: { $ref: '#/components/schemas/MatchProfileChoices' }
            desktopTesting: { $ref: '#/components/schemas/MatchProfileChoices' }
            higherEducationDegree: { $ref: '#/components/schemas/MatchProfileChoices' }
            english: { $ref: '#/components/schemas/MatchProfileChoices' }
            spanish: { $ref: '#/components/schemas/MatchProfileChoices' }
            yearsOfExperience:
              type: number
              minimum: 0
              maximum: 100
              multipleOf: 0.1
            continuousIntegration: { $ref: '#/components/schemas/MatchProfileChoices' }
            certification: { $ref: '#/components/schemas/MatchProfileChoices' }
            testAutomationTechnologies: { $ref: '#/components/schemas/MatchProfileChoices' }
            tecnologies: { $ref: '#/components/schemas/MatchProfileChoices' }
            programmingLanguages: { $ref: '#/components/schemas/MatchProfileChoices' }
            genAITools: { $ref: '#/components/schemas/MatchProfileChoices' }
            level: { $ref: '#/components/schemas/MatchProfileChoices' }
            classification: { $ref: '#/components/schemas/MatchProfileChoices' }
            role: { $ref: '#/components/schemas/MatchProfileChoices' }
            specialization: { $ref: '#/components/schemas/MatchProfileChoices' }
    CandidateMatchProfileUpdateRequest:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          minProperties: 1
          additionalProperties: false
          description: Campos omitidos permanecem iguais; null ou lista vazia remove valor.
          properties:
            type: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            agile: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            programming: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            automation: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            webTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            apiTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            mobileTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            desktopTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            higherEducationDegree: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            english: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            spanish: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            yearsOfExperience:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              multipleOf: 0.1
            continuousIntegration: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            certification: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            testAutomationTechnologies: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            tecnologies: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            programmingLanguages: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            genAITools: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            level: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            classification: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            role: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            specialization: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
    MatchProfileUpdateChoices:
      nullable: true
      oneOf:
        - type: string
          minLength: 1
          maxLength: 100
        - type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
    CandidateMatchProfile:
      type: object
      required: [_id, candidate, configurationVersion, revision, values, pendingFields, createdAt, updatedAt]
      additionalProperties: false
      properties:
        _id: { type: string }
        candidate: { type: string }
        configurationVersion: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        values:
          type: object
          description: Somente valores canonicos preenchidos
        pendingFields:
          type: array
          items: { type: string }
        matchEligible:
          type: boolean
          readOnly: true
          description: Retornado pela edicao; true somente para candidato active com algum valor informado
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicMatchChoice:
      type: object
      required: [id, label]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string, nullable: true }
    PublicMatchChoices:
      type: array
      nullable: true
      items:
        $ref: '#/components/schemas/PublicMatchChoice'
    PublicCandidateMatchValues:
      type: object
      description: Todas as 22 chaves; null indica nao informado.
      additionalProperties: false
      required: [type, agile, programming, automation, webTesting, apiTesting, mobileTesting,
        desktopTesting, higherEducationDegree, english, spanish, yearsOfExperience,
        continuousIntegration, certification, testAutomationTechnologies, tecnologies,
        programmingLanguages, genAITools, level, classification, role, specialization]
      properties:
        type: { $ref: '#/components/schemas/PublicMatchChoices' }
        agile: { $ref: '#/components/schemas/PublicMatchChoices' }
        programming: { $ref: '#/components/schemas/PublicMatchChoices' }
        automation: { $ref: '#/components/schemas/PublicMatchChoices' }
        webTesting: { $ref: '#/components/schemas/PublicMatchChoices' }
        apiTesting: { $ref: '#/components/schemas/PublicMatchChoices' }
        mobileTesting: { $ref: '#/components/schemas/PublicMatchChoices' }
        desktopTesting: { $ref: '#/components/schemas/PublicMatchChoices' }
        higherEducationDegree: { $ref: '#/components/schemas/PublicMatchChoices' }
        english: { $ref: '#/components/schemas/PublicMatchChoices' }
        spanish: { $ref: '#/components/schemas/PublicMatchChoices' }
        yearsOfExperience: { type: number, nullable: true }
        continuousIntegration: { $ref: '#/components/schemas/PublicMatchChoices' }
        certification: { $ref: '#/components/schemas/PublicMatchChoices' }
        testAutomationTechnologies: { $ref: '#/components/schemas/PublicMatchChoices' }
        tecnologies: { $ref: '#/components/schemas/PublicMatchChoices' }
        programmingLanguages: { $ref: '#/components/schemas/PublicMatchChoices' }
        genAITools: { $ref: '#/components/schemas/PublicMatchChoices' }
        level: { $ref: '#/components/schemas/PublicMatchChoices' }
        classification: { $ref: '#/components/schemas/PublicMatchChoices' }
        role: { $ref: '#/components/schemas/PublicMatchChoices' }
        specialization: { $ref: '#/components/schemas/PublicMatchChoices' }
    PublicCandidateMatchProfile:
      type: object
      required: [_id, candidate, values]
      additionalProperties: false
      properties:
        _id: { type: string }
        candidate: { type: string }
        revision:
          type: integer
          minimum: 1
          description: Visivel apenas ao candidato titular
        values:
          $ref: '#/components/schemas/PublicCandidateMatchValues'
    CandidateStatus:
      type: string
      enum: [pending_validation, incomplete_profile, active, inactive, blocked]
      description: Pendente de validacao, Perfil incompleto, Ativo, Inativo ou Bloqueado
    CandidateEligibilityRequest:
      type: object
      additionalProperties: false
      properties:
        purchaseCode:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Codigo em texto puro comparado ao hash seguro vinculado ao email autenticado
        trustedIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Outro identificador aprovado comparado ao hash seguro da base autorizada
    CandidateEligibility:
      type: object
      required: [status, method, lastAttemptAt, approvedAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        method:
          type: string
          enum: [unknown, email, purchase_code, trusted_identifier, multiple, legacy]
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
    CandidateRegistrationRequest:
      type: object
      required: [name, email]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Maria Silva
        email:
          type: string
          format: email
          description: Mesmo email da conta autenticada
          example: maria@example.com
        purchaseCode:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Codigo opcional; o valor original e comparado ao SHA-256 vinculado ao email autenticado
        trustedIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Outro identificador confiavel aprovado pelo produto; o valor original e comparado ao hash vinculado ao email
        photoUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        phone:
          type: string
          nullable: true
          default: UNKNOWN
          description: Telefone de 6 a 40 caracteres (digitos e pontuacao) ou UNKNOWN
        city:
          $ref: '#/components/schemas/CandidateOptionalText'
        state:
          $ref: '#/components/schemas/CandidateOptionalText'
        country:
          $ref: '#/components/schemas/CandidateOptionalText'
        linkedinUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        githubUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        portfolioUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        professionalSummary:
          type: string
          nullable: true
          minLength: 1
          maxLength: 5000
          default: UNKNOWN
        availability:
          type: string
          nullable: true
          enum: [available, unavailable, UNKNOWN, null]
          default: UNKNOWN
          description: Booleanos nao sao aceitos; ausente ou null significa UNKNOWN
    CandidateUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          description: Alterar reinicia a elegibilidade e atualiza a conta na mesma transacao
        photoUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        phone:
          type: string
          nullable: true
          description: Telefone valido, UNKNOWN ou null para remover a informacao
        city:
          $ref: '#/components/schemas/CandidateOptionalText'
        state:
          $ref: '#/components/schemas/CandidateOptionalText'
        country:
          $ref: '#/components/schemas/CandidateOptionalText'
        linkedinUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        githubUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        portfolioUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        professionalSummary:
          type: string
          nullable: true
          minLength: 1
          maxLength: 5000
          description: Texto, UNKNOWN ou null para remover a informacao
        availability:
          type: string
          nullable: true
          enum: [available, unavailable, UNKNOWN, null]
          description: Booleanos nao sao aceitos; UNKNOWN ou null representam dado nao informado
    CandidateOptionalText:
      type: string
      nullable: true
      minLength: 1
      maxLength: 2048
      description: Texto ou UNKNOWN; null representa informacao explicitamente nao fornecida
    CandidateOptionalUrl:
      type: string
      nullable: true
      minLength: 1
      maxLength: 2048
      description: URL HTTP/HTTPS absoluta ou UNKNOWN; null remove a informacao
    Candidate:
      type: object
      required: [_id, user, name, email, status, eligibility, visibleToCompanies]
      properties:
        _id:
          type: string
        user:
          type: string
          description: Conta vinculada pelo JWT, nunca pelo corpo da requisicao
        name:
          type: string
        email:
          type: string
          format: email
        photoUrl:
          type: string
        phone:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        linkedinUrl:
          type: string
        githubUrl:
          type: string
        portfolioUrl:
          type: string
        professionalSummary:
          type: string
        availability:
          type: string
          enum: [available, unavailable, UNKNOWN]
        status:
          $ref: '#/components/schemas/CandidateStatus'
        eligibility:
          $ref: '#/components/schemas/CandidateEligibility'
        visibleToCompanies:
          type: boolean
          readOnly: true
          description: Derivado exclusivamente de status active; sempre false no cadastro
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicCandidate:
      type: object
      required:
        - _id
        - name
        - photoUrl
        - email
        - phone
        - city
        - state
        - country
        - linkedinUrl
        - githubUrl
        - portfolioUrl
        - professionalSummary
        - availability
      additionalProperties: false
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b6
        name:
          type: string
          example: Maria Silva
        photoUrl:
          type: string
          description: URL publica da foto ou UNKNOWN
        email:
          type: string
          format: email
          example: maria@example.com
        phone:
          type: string
          description: Telefone de contato ou UNKNOWN
        city:
          type: string
        state:
          type: string
        country:
          type: string
        linkedinUrl:
          type: string
          description: URL publica ou UNKNOWN
        githubUrl:
          type: string
          description: URL publica ou UNKNOWN
        portfolioUrl:
          type: string
          description: URL publica ou UNKNOWN
        professionalSummary:
          type: string
        availability:
          type: string
          enum: [available, unavailable, UNKNOWN]
        status:
          allOf:
            - $ref: '#/components/schemas/CandidateStatus'
          description: Retornado somente quando o candidato consulta o proprio cadastro
    PublicUser:
      type: object
      required: [_id, name]
      additionalProperties: false
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b7
        name:
          type: string
          example: Maria Silva
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Nome nao vazio apos remover espacos nas extremidades
          example: Maria Silva
        email:
          type: string
          format: email
          description: Email unico, normalizado para minusculas e sem espacos nas extremidades
          example: maria.nova@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: Maximo de 72 bytes em UTF-8; mesmos limites do cadastro
          example: novaSenhaForte123
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b7
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        role:
          type: string
          enum: [candidate, company, admin]
          example: candidate
        status:
          type: string
          enum: [active, inactive]
          default: active
          readOnly: true
          example: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123
        role:
          type: string
          enum: [candidate, company]
          default: candidate
          example: candidate

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT HS256 com sub, role, iat e exp; expiracao definida por JWT_EXPIRES_IN
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
