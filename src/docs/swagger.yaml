      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Nome nao vazio apos remover espacos nas extremidades
          example: Maria Silva
        email:
          type: string
          format: email
          description: Email unico, normalizado para minusculas e sem espacos nas extremidades
          example: maria.nova@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: Maximo de 72 bytes em UTF-8; mesmos limites do cadastro
          example: novaSenhaForte123
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b7
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        role:
          type: string
          enum: [candidate, company, admin]
          example: candidate
        status:
          type: string
          enum: [active, inactive]
          default: active
          readOnly: true
          example: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123
        role:
          type: string
          enum: [candidate, company]
          default: candidate
          example: candidate

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT HS256 com sub, role, iat e exp; expiracao definida por JWT_EXPIRES_IN
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
