            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      responses:
        '200':
          description: Dados publicos do usuario
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '400':
          description: Identificador de usuario malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Users]
      summary: Exclui a propria conta e o candidato vinculado (VJ-23)
      description: >
        Exige JWT valido e conta ativa. Exclui fisicamente usuario e candidatos vinculados
        numa unica transacao; requer MongoDB replica set ou Atlas. Libera os emails para
        novo cadastro e invalida o acesso com tokens antigos pela verificacao da conta no banco.
        Somente o titular pode excluir a conta, inclusive quando o papel e admin.
        Repetir DELETE do proprio id ausente com JWT ainda assinado e nao expirado retorna
        404 sem autorizar operacoes; em outras rotas o token da conta excluida retorna 401.
        JWT expirado ou invalido sempre retorna 401. Nao recebe corpo.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId da propria conta
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      responses:
        '204':
          description: Usuario e candidatos vinculados excluidos; resposta sem corpo
        '400':
          description: Identificador ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT ausente, invalido ou expirado; conta inativa ou excluida (exceto repeticao do proprio DELETE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Alvo existente pertence a outro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario inexistente ou repeticao da exclusao do proprio identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco indisponivel ou sem suporte a transacoes; exclusao nao confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Users]
      summary: Edita os dados do proprio usuario (VJ-4)
      description: >
        Exige JWT valido. Permite alterar name, email e password; campos omitidos
        permanecem inalterados. Campos nao editaveis e corpo vazio sao rejeitados.
        O usuario deve existir e pertencer ao titular do token, inclusive para administradores.
        A senha alterada e persistida com hash bcrypt e nunca aparece na resposta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId do usuario a editar
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 6512f1e2b3a1c2d3e4f5a6b7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Dados atualizados sem senha ou hash na resposta
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Identificador, JSON ou dados invalidos; corpo vazio ou campos nao editaveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tentativa de editar outro usuario existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario inexistente ou removido durante a edicao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja utilizado por outro usuario, inclusive em alteracoes concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (VJ-2)
      description: >
        Exige email e senha. Valida a senha contra o hash bcrypt armazenado e retorna
        um JWT HS256 com expiracao configurada por JWT_EXPIRES_IN (padrao 1d).
        Email desconhecido, senha incorreta e usuario inativo retornam a mesma mensagem
        de credenciais invalidas. Senha e hash nunca aparecem na resposta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario autenticado e token de acesso com expiracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email ou senha ausentes/invalidos ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais invalidas ou usuario inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Credenciais invalidas
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /usuarios:
    post:
      tags: [Users]
      summary: Registra um usuario (VJ-1)
      description: >
        Cadastro publico. Cria o usuario com status active e retorna seus dados sem
        senha ou token JWT. O email e unico entre todos os endpoints de cadastro,
        normalizado para minusculas e sem espacos nas extremidades.
        O status e definido pelo servidor; valores enviados pelo cliente sao ignorados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario ativo criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Campos obrigatorios ausentes ou invalidos, perfil invalido ou JSON invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ja cadastrado, inclusive em cadastros concorrentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/health:
    get:
      tags: [Health]
      summary: Verifica se a API esta no ar
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Cadastra um novo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Ja existe um usuario com este email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuario ativo (endpoint existente)
      description: >
        Compartilha as regras e o retorno de /login. Mantem HTTP 422 para campos
        invalidos. Usuario inativo, email desconhecido ou senha incorreta retornam
        HTTP 401 com a mesma mensagem de credenciais invalidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacao realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/users/me:
    get:
      tags: [Users]
      summary: Retorna o perfil do usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token ausente, invalido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  responses:
    BadRequest:
      description: JSON invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Corpo da requisicao excede o limite permitido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dados invalidos (incluindo tentativa de cadastro com role admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Banco de dados ou dependencia temporariamente indisponivel
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MatchProfileOption:
      type: object
      required: [id, label, aliases]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_-]*$', example: cypress }
        label: { type: string, example: Cypress }
        aliases:
          type: array
          items: { type: string }
    MatchProfileFieldInput:
      type: object
      required: [weight, options]
      additionalProperties: false
      properties:
        weight: { type: integer, minimum: 1 }
        options:
          type: array
          items:
            $ref: '#/components/schemas/MatchProfileOption'
    MatchProfileConfigurationRequest:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        geographyWeights:
          type: object
          description: Pesos inteiros positivos por dimensão; publicar antes de usar restrições geográficas.
          required: [country, state, city]
          additionalProperties: false
          properties:
            country: { type: integer, minimum: 1 }
            state: { type: integer, minimum: 1 }
            city: { type: integer, minimum: 1 }
        fields:
          type: object
          description: >
            Exatamente as 22 chaves tecnicas da VJ-28. Em testAutomationTechnologies,
            publicar IDs canonicos com labels e aliases conferidos na base real;
            a proposta opcional pode ser gerada por npm run match:automation-proposal.
            Em programmingLanguages, a proposta opcional pode ser gerada por
            npm run match:programming-languages-proposal; Java, JavaScript,
            TypeScript, C, C++ e C# devem manter IDs distintos.
            Uma nova publicacao deve preservar todos os IDs ja publicados.
          minProperties: 22
          maxProperties: 22
          additionalProperties:
            $ref: '#/components/schemas/MatchProfileFieldInput'
    MatchProfileConfiguration:
      type: object
      required: [_id, version, fields, createdAt]
      properties:
        geographyWeights:
          type: object
          nullable: true
          description: Pesos publicados para restrições geográficas explícitas.
        _id: { type: string }
        version: { type: integer, minimum: 1 }
        fields:
          type: array
          items:
            type: object
            required: [key, weight, options]
            properties:
              key: { type: string }
              weight: { type: integer }
              options:
                type: array
                items:
                  $ref: '#/components/schemas/MatchProfileOption'
        createdAt: { type: string, format: date-time }
    CompanyVacancyRequest:
      type: object
      required: [reference, title, description, matchProfile]
      additionalProperties: false
      properties:
        reference: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$', maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        expiresAt: { type: string, format: date-time, nullable: true, description: Prazo futuro em UTC }
        location:
          type: object
          nullable: true
          minProperties: 1
          additionalProperties: false
          properties:
            city: { type: string, minLength: 1, maxLength: 200 }
            state: { type: string, minLength: 1, maxLength: 200 }
            country: { type: string, minLength: 1, maxLength: 200 }
        geographicRestrictions:
          type: object
          nullable: true
          minProperties: 1
          additionalProperties: false
          description: Restricoes explicitas, independentes do endereco da empresa e da modalidade.
          properties:
            country: { $ref: '#/components/schemas/GeographicRestriction' }
            state: { $ref: '#/components/schemas/GeographicRestriction' }
            city: { $ref: '#/components/schemas/GeographicRestriction' }
        matchProfile:
          type: object
          required: [values]
          additionalProperties: false
          properties:
            values:
              type: object
              minProperties: 1
              required: [type]
              description: >
                Chaves tecnicas da VJ-28. type representa modalidade; demais campos de catalogo
                aceitam ID, rotulo ou alias publicado, sempre persistido como ID canonico.
                yearsOfExperience aceita numero de 0 a 100 com uma casa decimal.
              additionalProperties: true
            requirements:
              type: array
              maxItems: 200
              description: Classificacao opcional na criacao; sem ela, vaga permanece pending e nao pode ser ativada.
              items: { $ref: '#/components/schemas/VacancyRequirement' }
    VacancyRequirement:
      type: object
      description: >
        Para campos de catalogo, use field, id canonico e importance. Para
        yearsOfExperience, use field, value numerico e importance.
      required: [field, importance]
      properties:
        field: { type: string, description: Chave tecnica da configuracao VJ-28 }
        id: { type: string, description: ID canonico; ausente em yearsOfExperience }
        value: { type: number, description: Valor numerico apenas em yearsOfExperience }
        importance: { type: string, enum: [required, desirable, indifferent] }
        eliminatory:
          type: boolean
          default: false
          description: Criterio eliminatorio explicito; invalido com importance indifferent
    Vacancy:
      type: object
      required: [_id, reference, title, description, matchProfile, origin, status]
      description: >
        Vagas COMPANY, IMPORTED e ADMIN compartilham as mesmas chaves, tipos e versao
        tecnica do Perfil de Match. A origem e procedencia sao atribuídas por fluxos
        confiaveis do servidor e nao participam do calculo tecnico. Para COMPANY,
        company e obrigatoria; para IMPORTED, importSource e importSourceId; para ADMIN,
        o autor administrativo e armazenado internamente. Sem origem verificavel,
        a vaga requer saneamento e nao fica apta ao Match. Na origem IMPORTED,
        false significa requisito nao identificado e nao aparece nos valores
        canonicos; a auditoria bruta permanece interna.
      properties:
        _id: { type: string }
        company: { type: string, nullable: true }
        importSource: { type: string, nullable: true }
        importSourceId: { type: string, nullable: true }
        reference: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: object, nullable: true }
        geographicRestrictions:
          type: object
          nullable: true
          description: Apenas dimensões declaradas participam do Match; endereço descritivo não pontua.
        matchProfile:
          type: object
          properties:
            configurationVersion: { type: integer, minimum: 1 }
            values: { type: object }
            requirements:
              type: array
              items: { $ref: '#/components/schemas/VacancyRequirement' }
        origin: { type: string, enum: [IMPORTED, COMPANY, ADMIN] }
        status: { type: string, enum: [pending, active, paused, expired, removed, rejected] }
        requirementsRevision: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyRegistrationUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        empresa:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            legalName: { type: string, minLength: 1, maxLength: 200 }
            tradeName: { type: string, minLength: 1, maxLength: 200, nullable: true }
            website: { type: string, format: uri, maxLength: 2048, nullable: true }
            description: { type: string, minLength: 1, maxLength: 5000, nullable: true }
            city: { type: string, minLength: 1, maxLength: 200 }
            state: { type: string, minLength: 1, maxLength: 200 }
            country: { type: string, minLength: 1, maxLength: 200 }
            responsibleName: { type: string, minLength: 1, maxLength: 200 }
            email: { type: string, format: email, maxLength: 254 }
            phone: { type: string, minLength: 6, maxLength: 40, nullable: true }
            linkedinUrl: { type: string, format: uri, maxLength: 2048, nullable: true }
            segment: { type: string, minLength: 1, maxLength: 200, nullable: true }
        usuarioAtual:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
        status:
          type: string
          enum: [active, inactive, blocked]
          description: Apenas admin; transicoes controladas
        verificationReference:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
          description: Obrigatoria ao ativar ou reativar; referencia de verificacao feita pelo operador
    CompanyUser:
      type: object
      required: [_id, company, user, role, status]
      properties:
        _id: { type: string }
        company: { type: string }
        user: { type: string }
        role: { type: string, enum: [recruiter] }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicCompanyUser:
      type: object
      required: [_id, name, email]
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    CompanyRegistrationRequest:
      type: object
      required: [legalName, responsibleName, email, city, state, country]
      additionalProperties: false
      properties:
        legalName: { type: string, minLength: 1, maxLength: 200 }
        tradeName: { type: string, minLength: 1, maxLength: 200, nullable: true }
        website: { type: string, format: uri, maxLength: 2048, nullable: true }
        description: { type: string, minLength: 1, maxLength: 5000, nullable: true }
        city: { type: string, minLength: 1, maxLength: 200 }
        state: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, minLength: 1, maxLength: 200 }
        responsibleName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 6, maxLength: 40, nullable: true }
        linkedinUrl: { type: string, format: uri, maxLength: 2048, nullable: true }
        segment: { type: string, minLength: 1, maxLength: 200, nullable: true }
    Company:
      type: object
      required: [_id, legalName, responsibleName, email, city, state, country, status]
      properties:
        _id: { type: string }
        legalName: { type: string }
        tradeName: { type: string, nullable: true }
        website: { type: string, nullable: true }
        description: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        responsibleName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        linkedinUrl: { type: string, nullable: true }
        segment: { type: string, nullable: true }
        status: { type: string, enum: [pending, active, inactive, blocked] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MatchProfileChoices:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 100
        - type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
    MatchProfileBooleanChoices:
      oneOf:
        - { $ref: '#/components/schemas/MatchProfileChoices' }
        - type: boolean
          description: true exige uma unica opcao publicada; false registra ausencia explicita.
    CandidateMatchProfileRequest:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          description: Catalogos aceitam somente valores publicados; chaves omitidas ficam pendentes.
          additionalProperties: false
          properties:
            type: { $ref: '#/components/schemas/MatchProfileChoices' }
            agile: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            programming: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            automation: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            webTesting: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            apiTesting: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            mobileTesting: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            desktopTesting: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            higherEducationDegree: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            english: { $ref: '#/components/schemas/MatchProfileChoices' }
            spanish: { $ref: '#/components/schemas/MatchProfileChoices' }
            yearsOfExperience:
              type: number
              minimum: 0
              maximum: 100
              multipleOf: 0.1
            continuousIntegration: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            certification: { $ref: '#/components/schemas/MatchProfileBooleanChoices' }
            testAutomationTechnologies: { $ref: '#/components/schemas/MatchProfileChoices' }
            tecnologies: { $ref: '#/components/schemas/MatchProfileChoices' }
            programmingLanguages: { $ref: '#/components/schemas/MatchProfileChoices' }
            genAITools: { $ref: '#/components/schemas/MatchProfileChoices' }
            level:
              allOf: [{ $ref: '#/components/schemas/MatchProfileChoices' }]
              description: Senioridade canonica; unknown/desconhecido nao sao opcoes validas.
            classification: { $ref: '#/components/schemas/MatchProfileChoices' }
            role: { $ref: '#/components/schemas/MatchProfileChoices' }
            specialization: { $ref: '#/components/schemas/MatchProfileChoices' }
    CandidateMatchProfileUpdateRequest:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          minProperties: 1
          additionalProperties: false
          description: Campos omitidos permanecem iguais; null ou lista vazia remove valor.
          properties:
            type: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            agile: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            programming: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            automation: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            webTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            apiTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            mobileTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            desktopTesting: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            higherEducationDegree: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            english: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            spanish: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            yearsOfExperience:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              multipleOf: 0.1
            continuousIntegration: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            certification: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            testAutomationTechnologies: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            tecnologies: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            programmingLanguages: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            genAITools: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            level:
              allOf: [{ $ref: '#/components/schemas/MatchProfileUpdateChoices' }]
              description: Senioridade canonica ou null para remover; unknown/desconhecido sao invalidos.
            classification: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            role: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
            specialization: { $ref: '#/components/schemas/MatchProfileUpdateChoices' }
    MatchProfileUpdateChoices:
      nullable: true
      oneOf:
        - type: string
          minLength: 1
          maxLength: 100
        - type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
    CandidateMatchProfile:
      type: object
      required: [_id, candidate, configurationVersion, revision, values, pendingFields, createdAt, updatedAt]
      additionalProperties: false
      properties:
        _id: { type: string }
        candidate: { type: string }
        configurationVersion: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        values:
          type: object
          description: Somente valores canonicos preenchidos
        pendingFields:
          type: array
          items: { type: string }
        matchEligible:
          type: boolean
          readOnly: true
          description: Retornado pela edicao; true somente para candidato active com algum valor informado
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CandidateStatus:
      type: string
      enum: [pending_validation, incomplete_profile, active, inactive, blocked]
      description: Pendente de validacao, Perfil incompleto, Ativo, Inativo ou Bloqueado
    CandidateEligibilityRequest:
      type: object
      additionalProperties: false
      properties:
        purchaseCode:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Codigo em texto puro comparado ao hash seguro vinculado ao email autenticado
        trustedIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Outro identificador aprovado comparado ao hash seguro da base autorizada
    CandidateEligibility:
      type: object
      required: [status, method, lastAttemptAt, approvedAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        method:
          type: string
          enum: [unknown, email, purchase_code, trusted_identifier, multiple, legacy]
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
    GeographicRestriction:
      type: object
      required: [value, importance]
      additionalProperties: false
      properties:
        value: { type: string, minLength: 1, maxLength: 200 }
        importance: { type: string, enum: [required, desirable, indifferent] }
    CandidateRegistrationRequest:
      type: object
      required: [name, email]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Maria Silva
        email:
          type: string
          format: email
          description: Mesmo email da conta autenticada
          example: maria@example.com
        purchaseCode:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Codigo opcional; o valor original e comparado ao SHA-256 vinculado ao email autenticado
        trustedIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Outro identificador confiavel aprovado pelo produto; o valor original e comparado ao hash vinculado ao email
        photoUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        phone:
          type: string
          nullable: true
          default: UNKNOWN
          description: Telefone de 6 a 40 caracteres (digitos e pontuacao) ou UNKNOWN
        city:
          $ref: '#/components/schemas/CandidateOptionalText'
        state:
          $ref: '#/components/schemas/CandidateOptionalText'
        country:
          $ref: '#/components/schemas/CandidateOptionalText'
        linkedinUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        githubUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        portfolioUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        professionalSummary:
          type: string
          nullable: true
          minLength: 1
          maxLength: 5000
          default: UNKNOWN
        availability:
          type: string
          nullable: true
          enum: [available, unavailable, UNKNOWN, null]
          default: UNKNOWN
          description: Booleanos nao sao aceitos; ausente ou null significa UNKNOWN
    CandidateUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          description: Alterar reinicia a elegibilidade e atualiza a conta na mesma transacao
        photoUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        phone:
          type: string
          nullable: true
          description: Telefone valido, UNKNOWN ou null para remover a informacao
        city:
          $ref: '#/components/schemas/CandidateOptionalText'
        state:
          $ref: '#/components/schemas/CandidateOptionalText'
        country:
          $ref: '#/components/schemas/CandidateOptionalText'
        linkedinUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        githubUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        portfolioUrl:
          $ref: '#/components/schemas/CandidateOptionalUrl'
        professionalSummary:
          type: string
          nullable: true
          minLength: 1
          maxLength: 5000
          description: Texto, UNKNOWN ou null para remover a informacao
        availability:
          type: string
          nullable: true
          enum: [available, unavailable, UNKNOWN, null]
          description: Booleanos nao sao aceitos; UNKNOWN ou null representam dado nao informado
    CandidateOptionalText:
      type: string
      nullable: true
      minLength: 1
      maxLength: 2048
      description: Texto ou UNKNOWN; null representa informacao explicitamente nao fornecida
    CandidateOptionalUrl:
      type: string
      nullable: true
      minLength: 1
      maxLength: 2048
      description: URL HTTP/HTTPS absoluta ou UNKNOWN; null remove a informacao
    Candidate:
      type: object
      required: [_id, user, name, email, status, eligibility, visibleToCompanies]
      properties:
        _id:
          type: string
        user:
          type: string
          description: Conta vinculada pelo JWT, nunca pelo corpo da requisicao
        name:
          type: string
        email:
          type: string
          format: email
        photoUrl:
          type: string
        phone:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        linkedinUrl:
          type: string
        githubUrl:
          type: string
        portfolioUrl:
          type: string
        professionalSummary:
          type: string
        availability:
          type: string
          enum: [available, unavailable, UNKNOWN]
        status:
          $ref: '#/components/schemas/CandidateStatus'
        eligibility:
          $ref: '#/components/schemas/CandidateEligibility'
        visibleToCompanies:
          type: boolean
          readOnly: true
          description: Derivado exclusivamente de status active; sempre false no cadastro
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicCandidate:
      type: object
      required:
        - _id
        - name
        - photoUrl
        - email
        - phone
        - city
        - state
        - country
        - linkedinUrl
        - githubUrl
        - portfolioUrl
        - professionalSummary
        - availability
      additionalProperties: false
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b6
        name:
          type: string
          example: Maria Silva
        photoUrl:
          type: string
          description: URL publica da foto ou UNKNOWN
        email:
          type: string
          format: email
          example: maria@example.com
        phone:
          type: string
          description: Telefone de contato ou UNKNOWN
        city:
          type: string
        state:
          type: string
        country:
          type: string
        linkedinUrl:
          type: string
          description: URL publica ou UNKNOWN
        githubUrl:
          type: string
          description: URL publica ou UNKNOWN
        portfolioUrl:
          type: string
          description: URL publica ou UNKNOWN
        professionalSummary:
          type: string
        availability:
          type: string
          enum: [available, unavailable, UNKNOWN]
        status:
          allOf:
            - $ref: '#/components/schemas/CandidateStatus'
          description: Retornado somente quando o candidato consulta o proprio cadastro
    PublicUser:
      type: object
      required: [_id, name]
      additionalProperties: false
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b7
        name:
          type: string
          example: Maria Silva
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Nome nao vazio apos remover espacos nas extremidades
          example: Maria Silva
        email:
          type: string
          format: email
          description: Email unico, normalizado para minusculas e sem espacos nas extremidades
          example: maria.nova@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: Maximo de 72 bytes em UTF-8; mesmos limites do cadastro
          example: novaSenhaForte123
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      properties:
        _id:
          type: string
          example: 6512f1e2b3a1c2d3e4f5a6b7
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        role:
          type: string
          enum: [candidate, company, admin]
          example: candidate
        status:
          type: string
          enum: [active, inactive]
          default: active
          readOnly: true
          example: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123
        role:
          type: string
          enum: [candidate, company]
          default: candidate
          example: candidate

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria.silva@example.com
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Maximo de 72 bytes em UTF-8
          example: senhaForte123

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT HS256 com sub, role, iat e exp; expiracao definida por JWT_EXPIRES_IN
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
